<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Stylised illustration of Lord Murugan's Vel and peacock">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#c1442b" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#1c0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a6b28"/>
      <stop offset="60%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#f0dCa0"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6b5c"/>
      <stop offset="100%" stop-color="#0f3a33"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="none"/>
  <circle cx="200" cy="126" r="150" fill="url(#halo)"/>

  <!-- peacock tail: fanned feathers with eyes -->
  <g stroke="#1f6b5c" stroke-width="1.4" fill="none" opacity=".85">
    <path d="M200 232 C120 216 78 172 66 118"/>
    <path d="M200 232 C134 206 100 158 96 100"/>
    <path d="M200 232 C160 200 146 150 152 92"/>
    <path d="M200 232 C200 196 200 146 200 86"/>
    <path d="M200 232 C240 200 254 150 248 92"/>
    <path d="M200 232 C266 206 300 158 304 100"/>
    <path d="M200 232 C280 216 322 172 334 118"/>
  </g>
  <g fill="url(#plume)" stroke="#c9a24a" stroke-width="1">
    <ellipse cx="66"  cy="114" rx="11" ry="15"/>
    <ellipse cx="96"  cy="96"  rx="11" ry="15"/>
    <ellipse cx="152" cy="88"  rx="11" ry="15"/>
    <ellipse cx="200" cy="82"  rx="11" ry="15"/>
    <ellipse cx="248" cy="88"  rx="11" ry="15"/>
    <ellipse cx="304" cy="96"  rx="11" ry="15"/>
    <ellipse cx="334" cy="114" rx="11" ry="15"/>
  </g>
  <g fill="#c1442b" opacity=".9">
    <circle cx="66"  cy="114" r="3.4"/>
    <circle cx="96"  cy="96"  r="3.4"/>
    <circle cx="152" cy="88"  r="3.4"/>
    <circle cx="200" cy="82"  r="3.4"/>
    <circle cx="248" cy="88"  r="3.4"/>
    <circle cx="304" cy="96"  r="3.4"/>
    <circle cx="334" cy="114" r="3.4"/>
  </g>

  <!-- peacock body -->
  <path d="M200 236 C186 224 184 206 192 194 C197 187 203 187 208 194 C216 206 214 224 200 236 Z"
        fill="#164d43" stroke="#c9a24a" stroke-width="1.1"/>
  <circle cx="200" cy="180" r="11" fill="#1f6b5c" stroke="#c9a24a" stroke-width="1.1"/>
  <circle cx="196" cy="178" r="1.9" fill="#f3e9d2"/>
  <path d="M200 169 L200 160 M195 162 L200 158 L205 162" stroke="#c9a24a" stroke-width="1.2" fill="none"/>
  <path d="M211 182 L221 185 L211 188 Z" fill="#c1442b"/>

  <!-- the Vel, rising through the composition -->
  <rect x="197.6" y="120" width="4.8" height="152" rx="2.4" fill="url(#vel)"/>
  <path d="M200 28 C213 66 224 92 224 106 C224 122 213 132 200 132
           C187 132 176 122 176 106 C176 92 187 66 200 28 Z"
        fill="url(#vel)" stroke="#f0dCa0" stroke-width="1.1"/>
  <path d="M200 44 C207 72 213 92 213 105 C213 116 207 122 200 122" fill="#1c0b10" opacity=".16"/>
  <ellipse cx="200" cy="136" rx="16" ry="5" fill="#c1442b"/>
  <ellipse cx="200" cy="136" rx="9"  ry="2.6" fill="#f0dCa0" opacity=".7"/>

  <!-- six points: the six faces of Shanmukha -->
  <g fill="#c9a24a" opacity=".55">
    <circle cx="200" cy="16"  r="2.6"/>
    <circle cx="163" cy="40"  r="2.2"/>
    <circle cx="237" cy="40"  r="2.2"/>
    <circle cx="148" cy="82"  r="2.2"/>
    <circle cx="252" cy="82"  r="2.2"/>
    <circle cx="200" cy="152" r="2.2"/>
  </g>
</svg>
